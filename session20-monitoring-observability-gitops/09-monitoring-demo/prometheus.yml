global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Intentional unavailable endpoint used only to demonstrate an alert.
  - job_name: unhealthy-demo
    static_configs:
      - targets:
          - localhost:65534
