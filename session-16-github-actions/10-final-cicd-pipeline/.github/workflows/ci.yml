name: Session 16 CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Display Python version
        run: python --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest -v
  build:
    name: Build and Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build application
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Build Docker image
        run: docker build --tag session16-calculator:${{ github.sha }} .
      - name: Record image metadata
        run: |
          mkdir -p build
          docker image inspect session16-calculator:${{ github.sha }} \
            --format 'Image: {{.RepoTags}}%nId: {{.Id}}%nCreated: {{.Created}}' \
            > build/image-info.txt
      - name: Show build output
        run: |
          cat build/build-info.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: build/
  security-check:
    name: Security Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Check for sensitive files
        run: |
          echo "Checking repository for common sensitive files..."
          if find . -type f \( \
            -name ".env" \
            -o -name "*.pem" \
            -o -name "*.key" \
          \) | grep -q .; then
            echo "Potential sensitive file found."
            exit 1
          else
            echo "No common sensitive files found."
          fi
  deliver:
    name: Deliver Deployment Package
    needs: [build, security-check]
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.DEMO_DEPLOY_TOKEN }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: calculator-build
          path: build
      - name: Prepare deployment package
        run: |
          mkdir -p delivery
          cp deploy/deployment.yaml delivery/deployment.yaml
          cp build/image-info.txt delivery/image-info.txt
          printf 'Commit: %s\nDelivery status: READY\n' "$GITHUB_SHA" > delivery/release-info.txt
          echo "Deployment package prepared for the staging delivery target."
      - name: Check protected deployment credential
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "Protected deployment credential is configured."
          else
            echo "DEMO_DEPLOY_TOKEN is not configured; package delivery completed without external deployment."
          fi
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: calculator-delivery-package
          path: delivery/
