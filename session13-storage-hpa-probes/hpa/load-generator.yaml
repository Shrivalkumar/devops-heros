apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-load-generator
spec:
  replicas: 4
  selector:
    matchLabels:
      app: hpa-load-generator
  template:
    metadata:
      labels:
        app: hpa-load-generator
    spec:
      containers:
        - name: load-generator
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - while true; do wget -q -O- http://hpa-demo.default.svc.cluster.local/ >/dev/null; done
