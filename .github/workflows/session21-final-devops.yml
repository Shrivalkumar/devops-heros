name: Session 21 Final DevOps Pipeline

on:
  push:
    branches: [main]
    paths: ["session21-python/**", ".github/workflows/session21-final-devops.yml"]
  pull_request:
    branches: [main]
    paths: ["session21-python/**", ".github/workflows/session21-final-devops.yml"]

permissions:
  contents: read
  packages: write

env:
  PROJECT: session21-python
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install and test the API
        working-directory: session21-python/backend
        run: |
          pip install -r requirements.txt
          pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build the web client
        working-directory: session21-python/frontend
        run: npm install && npm run build

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: SAST - Bandit
        working-directory: session21-python/backend
        run: pip install bandit && bandit -r app -ll
      - name: SCA - pip-audit
        working-directory: session21-python/backend
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Secret scan - Gitleaks
        uses: gitleaks/gitleaks-action@v2
      - name: IaC scan - Trivy config
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: session21-python
          exit-code: "1"
          severity: HIGH,CRITICAL

  build_scan_push:
    needs: security
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }} session21-python/backend
      - name: Build frontend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }} session21-python/frontend
      - name: Container image scan - Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Security gate and image push
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}

  deploy:
    needs: build_scan_push
    # Enable this only after adding KUBE_CONFIG_DATA and the DEPLOY_TO_KUBERNETES
    # repository variable. Pull requests still exercise every earlier security gate.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TO_KUBERNETES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: "Configure kubectl from the protected repository secret"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: mkdir -p ~/.kube && echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
      - name: Deploy with Helm
        run: |
          helm upgrade --install taskboard session21-python/helm/taskboard --namespace taskboard --create-namespace \
            --set backend.image=ghcr.io/${{ github.repository_owner }}/taskboard-backend \
            --set frontend.image=ghcr.io/${{ github.repository_owner }}/taskboard-frontend \
            --set backend.tag=${{ needs.build_scan_push.outputs.image_tag }} \
            --set frontend.tag=${{ needs.build_scan_push.outputs.image_tag }}
