apiVersion: apps/v1
kind: Deployment
metadata: {name: taskboard-frontend, labels: {app: taskboard-frontend}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: taskboard-frontend}}
  template:
    metadata: {labels: {app: taskboard-frontend}}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports: [{containerPort: 80}]
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
        readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 10}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "taskboard.fullname" . }}-frontend-nginx
